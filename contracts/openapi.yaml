      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, WITHDRAWN]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, CANCELED]
    ParticipationStatus:
      type: string
      enum: [JOINED, CANCELED]
    PaymentType:
      type: string
      enum: [EVENT_FEE, MEMBERSHIP_DUE]
    PaymentStatus:
      type: string
      enum: [NOT_REQUIRED, UNPAID, REPORTED, CONFIRMED, REJECTED, VOID, REFUND_PENDING, REFUNDED]
