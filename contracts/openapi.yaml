          $ref: '#/components/schemas/MemberPart'
        displayNickname:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        onboardingCompleted:
          type: boolean
        approvedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    AdminMemberActionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
    AdminMemberRoleRequest:
      type: object
      required: [role, version]
      properties:
        role:
          $ref: '#/components/schemas/MemberRole'
        version:
          type: integer
          format: int64
          minimum: 0
    PaymentSettingRequest:
      type: object
      required: [bankName, accountNumber, accountHolder]
      properties:
        bankName:
          type: string
          maxLength: 100
        accountNumber:
          type: string
          maxLength: 100
        accountHolder:
          type: string
          maxLength: 100
        kakaoPayReceiveUrl:
          type: string
          maxLength: 500
    PaymentSettingResponse:
      type: object
      required: [id, bankName, accountNumber, accountHolder, active, createdBy, createdAt]
      properties:
        id:
          type: integer
          format: int64
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string
        kakaoPayReceiveUrl:
          type: string
        active:
          type: boolean
        createdBy:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    NotificationItem:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        linkUrl:
          type: string
        readAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationResponse:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        unreadCount:
          type: integer
          format: int64
    Problem:
      type: object
      description: 모든 API 실패에 사용하는 RFC 7807 호환 공통 응답
      required: [type, title, status, code, detail, instance, timestamp, fieldErrors]
      properties:
        type:
          type: string
          description: 오류 유형 URI. 별도 문서 URI가 없으면 about:blank
          example: about:blank
        title:
          type: string
          description: HTTP 상태 이름
          example: Bad Request
        status:
          type: integer
          description: HTTP 상태 코드
          example: 400
        code:
          type: string
          description: 프론트엔드 분기 처리용 안정적인 오류 코드
          example: VALIDATION_FAILED
        detail:
          type: string
          description: 사용자에게 표시할 수 있는 오류 설명
          example: 요청 값을 확인해 주세요.
        instance:
          type: string
          description: 오류가 발생한 요청 경로
          example: /api/v1/me/onboarding
        timestamp:
          type: string
          format: date-time
          description: 오류 발생 시각(UTC)
        fieldErrors:
          type: array
          description: 필드 단위 검증 오류. 검증 오류가 아니면 빈 배열
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
                description: 오류 필드명
                example: name
              reason:
                type: string
                description: 검증 실패 이유
                example: 공백일 수 없습니다
