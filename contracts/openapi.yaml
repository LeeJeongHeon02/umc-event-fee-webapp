openapi: 3.1.0
info:
  title: Club Event & Fee Management API
  version: 0.1.0
  description: 교내 개발 동아리 행사·회비 관리 웹앱의 첫 번째 세로 기능 API 계약
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Auth
  - name: Me
  - name: Events
  - name: Payments
  - name: Admin
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      security: []
      operationId: getCsrfToken
      summary: 상태 변경 요청용 CSRF 토큰 발급
      responses:
        '200':
          description: CSRF 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /auth/local/register:
    post:
      tags: [Auth]
      security: []
      operationId: registerLocalMember
      summary: 로컬 계정 회원가입
      description: 아이디와 전화번호는 중복될 수 없으며 비밀번호는 BCrypt 해시로만 저장한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalRegisterRequest'
      responses:
        '201':
          description: 가입된 로컬 계정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/local/login:
    post:
      tags: [Auth]
      security: []
      operationId: loginLocalMember
      summary: 로컬 계정 로그인
      description: 로그인에 성공하면 카카오 로그인과 같은 서버 세션을 생성하고 다음 화면 경로를 반환한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLoginRequest'
      responses:
        '200':
          description: 로그인한 회원과 다음 화면 경로
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMember
      summary: 현재 웹앱 세션 로그아웃
      description: 카카오·로컬 공통. 세션 무효화와 JSESSIONID·XSRF-TOKEN 쿠키 삭제. CSRF 헤더가 필요하며 카카오 계정 연결은 유지된다.
      responses:
        '204':
          description: 로그아웃 완료 (본문 없음)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 현재 사용자 조회
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/onboarding:
    patch:
      tags: [Me]
      operationId: completeOnboarding
      summary: 최초 온보딩 완료
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: 온보딩 완료 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/profile:
    patch:
      tags: [Me]
      operationId: updateMyProfile
      summary: 내 프로필 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: 수정된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /events:
    get:
      tags: [Events]
      operationId: getEvents
      summary: 게시 행사 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: participating
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 행사 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: 행사 상세 조회
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 행사 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{eventId}/participation:
    post:
      tags: [Events]
      operationId: joinEvent
      summary: 행사 참가 신청
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: 참가 신청 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinEventResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /events/{eventId}/participation/cancel:
    post:
      tags: [Events]
      operationId: cancelEventParticipation
      summary: 행사 참가 취소
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelParticipationRequest'
      responses:
        '200':
          description: 참가 취소 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelParticipationResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/payment-obligations:
    get:
      tags: [Payments]
      operationId: getMyPaymentObligations
      summary: 내 납부 항목 목록
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: 납부 항목 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
  /payment-obligations/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPaymentObligation
      summary: 내 납부 상세 조회
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 납부 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /payment-obligations/{paymentId}/reports:
    post:
      tags: [Payments]
      operationId: reportPayment
      summary: 송금 완료 신고
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReportRequest'
      responses:
        '201':
          description: 접수된 송금 신고
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReportResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: 운영진 대시보드 조회
      responses:
        '200':
          description: 운영 현황 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      tags: [Notifications]
      operationId: getNotifications
      summary: 내 알림 목록과 읽지 않은 개수 조회
      responses:
        '200':
          description: 내 알림
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: readNotification
      summary: 알림 읽음 처리
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: 읽은 알림
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationItem'
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: readAllNotifications
      summary: 모든 알림 읽음 처리
      responses:
        '204':
          description: 처리 완료
  /admin/events:
    get:
      tags: [Admin]
      operationId: getAdminEvents
      summary: 운영진 행사 전체 목록 조회
      responses:
        '200':
          description: 행사 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminEventResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      operationId: createAdminEvent
      summary: 행사 초안 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventCreateRequest'
      responses:
        '201':
          description: 생성된 행사 초안
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/events/{eventId}:
    get:
      tags: [Admin]
      operationId: getAdminEvent
      summary: 운영진 행사 상세 조회
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 행사 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Admin]
      operationId: updateAdminEvent
      summary: 행사 초안 수정
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventUpdateRequest'
      responses:
        '200':
          description: 수정된 행사
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventResponse'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Admin]
      operationId: deleteAdminEvent
      summary: 참가 이력이 없는 행사 초안 삭제
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '204':
          description: 삭제 완료
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/events/{eventId}/publish:
    post:
      tags: [Admin]
      operationId: publishAdminEvent
      summary: 행사 초안 공개
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventVersionRequest'
      responses:
        '200':
          description: 공개된 행사
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/events/{eventId}/close:
    post:
      tags: [Admin]
      operationId: closeAdminEvent
      summary: 공개 행사 종료
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventTransitionRequest'
      responses:
        '200':
          description: 종료된 행사
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/events/{eventId}/cancel:
    post:
      tags: [Admin]
      operationId: cancelAdminEvent
      summary: 행사 취소 및 납부 상태 정리
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventTransitionRequest'
      responses:
        '200':
          description: 행사 취소 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventCancelResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/events/{eventId}/participants:
    get:
      tags: [Admin]
      operationId: getAdminEventParticipants
      summary: 행사별 참가자와 참가비 납부 현황 조회
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: paymentStatus
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: 행사 참가자 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventParticipantPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dues-rounds/{duesRoundId}/payments:
    get:
      tags: [Admin]
      operationId: getAdminDuesPayments
      summary: 회비 차수별 부원 납부 현황 조회
      parameters:
        - $ref: '#/components/parameters/DuesRoundId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: paymentStatus
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: 회비 납부 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDuesPaymentPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dues-rounds:
    get:
      tags: [Admin]
      operationId: getAdminDuesRounds
      summary: 회비 차수 목록 조회
      responses:
        '200':
          description: 회비 차수 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminDuesRoundResponse'
    post:
      tags: [Admin]
      operationId: createAdminDuesRound
      summary: 회비 차수 초안 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDuesRoundRequest'
      responses:
        '201':
          description: 생성된 회비 차수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDuesRoundResponse'
  /admin/dues-rounds/{duesRoundId}:
    patch:
      tags: [Admin]
      operationId: updateAdminDuesRound
      summary: 회비 차수 초안 수정
      parameters:
        - $ref: '#/components/parameters/DuesRoundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDuesRoundRequest'
      responses:
        '200':
          description: 수정된 회비 차수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDuesRoundResponse'
    delete:
      tags: [Admin]
      operationId: deleteAdminDuesRound
      summary: 회비 차수 초안 삭제
      parameters:
        - $ref: '#/components/parameters/DuesRoundId'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '204':
          description: 삭제 완료
  /admin/dues-rounds/{duesRoundId}/publish:
    post:
      tags: [Admin]
      operationId: publishAdminDuesRound
      summary: 회비 차수 공개 및 활성 부원 납부 항목 생성
      parameters:
        - $ref: '#/components/parameters/DuesRoundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminEventVersionRequest'
      responses:
        '200':
          description: 공개 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDuesPublishResponse'
  /admin/payment-obligations/{paymentId}/confirm:
    post:
      tags: [Admin]
      operationId: confirmAdminPayment
      summary: 송금 신고 승인
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPaymentReviewRequest'
      responses:
        '200':
          description: 승인된 납부 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/payment-obligations/{paymentId}/reject:
    post:
      tags: [Admin]
      operationId: rejectAdminPayment
      summary: 송금 신고 반려
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPaymentReviewRequest'
      responses:
        '200':
          description: 반려된 납부 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/payment-reports:
    get:
      tags: [Admin]
      operationId: getAdminPaymentReports
      summary: 행사비·회비 확인 대기 송금 신고 통합 조회
      description: STAFF 또는 ADMIN 전용. REPORTED 상태 전체를 최신 신고 순으로 반환한다. 대시보드 미리보기의 10건 제한을 적용하지 않는다. 신고가 없으면 빈 배열이다.
      responses:
        '200':
          description: 확인 대기 송금 신고 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPaymentRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/refunds:
    get:
      tags: [Admin]
      operationId: getAdminRefunds
      summary: 환불 대기 목록 조회
      responses:
        '200':
          description: 환불 대기 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminPaymentRow'
  /admin/payment-obligations/{paymentId}/refund:
    post:
      tags: [Admin]
      operationId: completeAdminRefund
      summary: 환불 완료 처리
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPaymentReviewRequest'
      responses:
        '200':
          description: 환불 완료 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentReviewResponse'
  /admin/members:
    get:
      tags: [Admin]
      operationId: getAdminMembers
      summary: 회원 목록 조회
      responses:
        '200':
          description: 회원 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminMemberResponse'
  /admin/members/{memberId}/approve:
    post:
      tags: [Admin]
      operationId: approveAdminMember
      summary: 가입 대기 회원 승인
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberActionRequest'
      responses:
        '200':
          description: 승인된 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMemberResponse'
  /admin/members/{memberId}/suspend:
    post:
      tags: [Admin]
      operationId: suspendAdminMember
      summary: 활성 회원 정지
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminMemberActionRequest'
      responses:
        '200':
          description: 정지된 회원
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMemberResponse'
  /admin/members/{memberId}/role:
    patch:
      tags: [Admin]
      operationId: changeAdminMemberRole
      summary: 활성 회원 역할 변경
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
