          type: string
          enum: [/onboarding, /pending, /home]
    MemberPart:
      type: string
      enum: [PLAN, DESIGN, PE_WEB, PE_MOBILE]
    MemberRole:
      type: string
      enum: [MEMBER, STAFF, ADMIN]
