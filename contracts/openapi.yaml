openapi: 3.1.0
info:
  title: Club Event & Fee Management API
  version: 0.1.0
  description: 교내 개발 동아리 행사·회비 관리 웹앱의 첫 번째 세로 기능 API 계약
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Me
  - name: Events
  - name: Payments
  - name: Admin
paths:
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: 현재 사용자 조회
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/onboarding:
    patch:
      tags: [Me]
      operationId: completeOnboarding
      summary: 최초 온보딩 완료
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: 온보딩 완료 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/profile:
    patch:
      tags: [Me]
      operationId: updateMyProfile
      summary: 내 프로필 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '200':
          description: 수정된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /events:
    get:
      tags: [Events]
      operationId: getEvents
      summary: 게시 행사 목록 조회
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: participating
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 행사 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: 행사 상세 조회
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: 행사 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{eventId}/participation:
    post:
      tags: [Events]
      operationId: joinEvent
      summary: 행사 참가 신청
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '201':
          description: 참가 신청 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinEventResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /events/{eventId}/participation/cancel:
    post:
      tags: [Events]
      operationId: cancelEventParticipation
      summary: 행사 참가 취소
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelParticipationRequest'
      responses:
        '200':
          description: 참가 취소 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelParticipationResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/payment-obligations:
    get:
      tags: [Payments]
      operationId: getMyPaymentObligations
      summary: 내 납부 항목 목록
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: 납부 항목 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
  /payment-obligations/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPaymentObligation
      summary: 내 납부 상세 조회
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: 납부 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /payment-obligations/{paymentId}/reports:
    post:
      tags: [Payments]
      operationId: reportPayment
      summary: 송금 완료 신고
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReportRequest'
      responses:
        '201':
          description: 접수된 송금 신고
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReportResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: 운영진 대시보드 조회
      responses:
        '200':
          description: 운영 현황 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/events/{eventId}/participants:
    get:
      tags: [Admin]
      operationId: getAdminEventParticipants
      summary: 행사별 참가자와 참가비 납부 현황 조회
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: paymentStatus
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: 행사 참가자 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventParticipantPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/dues-rounds/{duesRoundId}/payments:
    get:
      tags: [Admin]
      operationId: getAdminDuesPayments
      summary: 회비 차수별 부원 납부 현황 조회
      parameters:
        - $ref: '#/components/parameters/DuesRoundId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: paymentStatus
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: 회비 납부 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDuesPaymentPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/payment-obligations/{paymentId}/confirm:
    post:
      tags: [Admin]
      operationId: confirmAdminPayment
      summary: 송금 신고 승인
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPaymentReviewRequest'
      responses:
        '200':
          description: 승인된 납부 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/payment-obligations/{paymentId}/reject:
    post:
      tags: [Admin]
      operationId: rejectAdminPayment
      summary: 송금 신고 반려
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPaymentReviewRequest'
      responses:
        '200':
          description: 반려된 납부 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPaymentReviewResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DuesRoundId:
      name: duesRoundId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 로그인 필요
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 접근 권한 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 리소스 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 현재 상태와 요청 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MemberPart:
      type: string
      enum: [PLAN, DESIGN, PE_WEB, PE_MOBILE]
    MemberRole:
      type: string
      enum: [MEMBER, STAFF, ADMIN]
    MemberStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, WITHDRAWN]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, CANCELED]
    ParticipationStatus:
      type: string
      enum: [JOINED, CANCELED]
    PaymentType:
      type: string
      enum: [EVENT_FEE, MEMBERSHIP_DUE]
    PaymentStatus:
      type: string
      enum: [NOT_REQUIRED, UNPAID, REPORTED, CONFIRMED, REJECTED, VOID, REFUND_PENDING, REFUNDED]
    PaymentMethod:
      type: string
      enum: [BANK_TRANSFER, KAKAO_PAY_CODE]
    MeResponse:
      type: object
      required: [id, kakaoProfileName, role, status, onboardingCompleted]
      properties:
        id:
          type: integer
          format: int64
        kakaoProfileName:
          type: string
        name:
          type: string
        part:
          $ref: '#/components/schemas/MemberPart'
        displayNickname:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          $ref: '#/components/schemas/MemberStatus'
        onboardingCompleted:
          type: boolean
        approvedAt:
          type: string
          format: date-time
    OnboardingRequest:
      type: object
      required: [name, part]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        part:
          $ref: '#/components/schemas/MemberPart'
    EventListItem:
      type: object
      required: [id, title, startsAt, registrationDeadline, joinedCount, feeAmount, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        summary:
          type: string
        location:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        registrationDeadline:
          type: string
          format: date-time
        capacity:
          type: integer
        joinedCount:
          type: integer
        feeAmount:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/EventStatus'
        myParticipationStatus:
          $ref: '#/components/schemas/ParticipationStatus'
        myPaymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
    EventPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventListItem'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    ParticipationSummary:
      type: object
      required: [id, status, joinedAt, version]
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/ParticipationStatus'
        joinedAt:
          type: string
          format: date-time
        canceledAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    PaymentSummary:
      type: object
      required: [id, type, amount, status, source, updatedAt, version]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/PaymentType'
        amount:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PaymentStatus'
        dueAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/PaymentSource'
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    PaymentSource:
      type: object
      required: [type, id, title]
      properties:
        type:
          type: string
          enum: [EVENT, DUES_ROUND]
        id:
          type: integer
          format: int64
        title:
          type: string
        dueAt:
          type: string
          format: date-time
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventListItem'
        - type: object
          required: [description, allowLateCancellation, canJoin, canCancel]
          properties:
            description:
              type: string
            allowLateCancellation:
              type: boolean
            canJoin:
              type: boolean
            canCancel:
              type: boolean
            myParticipation:
              $ref: '#/components/schemas/ParticipationSummary'
            myPayment:
              $ref: '#/components/schemas/PaymentSummary'
    JoinEventResponse:
      type: object
      required: [participation, payment]
      properties:
        participation:
          $ref: '#/components/schemas/ParticipationSummary'
        payment:
          $ref: '#/components/schemas/PaymentSummary'
    CancelParticipationRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        reason:
          type: string
          maxLength: 300
    CancelParticipationResponse:
      type: object
      required: [participationStatus, paymentStatus, refundRequired]
      properties:
        participationStatus:
          $ref: '#/components/schemas/ParticipationStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        refundRequired:
          type: boolean
    PaymentPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSummary'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    PaymentDestination:
      type: object
      required: [bankName, accountNumber, accountHolder]
      properties:
        bankName:
          type: string
        accountNumber:
          type: string
        accountHolder:
          type: string
        kakaoPayReceiveUrl:
          type: string
          format: uri
    PaymentReport:
      type: object
      required: [id, method, senderName, reportedAt]
      properties:
        id:
          type: integer
          format: int64
        method:
          $ref: '#/components/schemas/PaymentMethod'
        senderName:
          type: string
        transferredAt:
          type: string
          format: date-time
        note:
          type: string
        reportedAt:
          type: string
          format: date-time
    PaymentStatusHistory:
      type: object
      required: [toStatus, changedAt]
      properties:
        fromStatus:
          $ref: '#/components/schemas/PaymentStatus'
        toStatus:
          $ref: '#/components/schemas/PaymentStatus'
        reason:
          type: string
        changedAt:
          type: string
          format: date-time
    PaymentDetail:
      allOf:
        - $ref: '#/components/schemas/PaymentSummary'
        - type: object
          required: [statusHistory]
          properties:
            paymentDestination:
              $ref: '#/components/schemas/PaymentDestination'
            latestReport:
              $ref: '#/components/schemas/PaymentReport'
            statusHistory:
              type: array
              items:
                $ref: '#/components/schemas/PaymentStatusHistory'
    PaymentReportRequest:
      type: object
      required: [method, senderName, transferConfirmed, version]
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        senderName:
          type: string
          minLength: 1
          maxLength: 100
        transferredAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 500
        transferConfirmed:
          type: boolean
          const: true
        version:
          type: integer
          format: int64
    PaymentReportResponse:
      type: object
      required: [report, paymentStatus, version]
      properties:
        report:
          $ref: '#/components/schemas/PaymentReport'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        version:
          type: integer
          format: int64
    AdminDashboardResponse:
      type: object
      required: [memberCount, pendingMemberCount, upcomingEventCount, unpaidCount, reportedCount, expectedAmount, confirmedAmount, collectionRate, upcomingEvents, activeDuesRounds, recentReports]
      properties:
        memberCount:
          type: integer
        pendingMemberCount:
          type: integer
        upcomingEventCount:
          type: integer
        unpaidCount:
          type: integer
        reportedCount:
          type: integer
        expectedAmount:
          type: integer
          format: int64
        confirmedAmount:
          type: integer
          format: int64
        collectionRate:
          type: number
          format: double
          minimum: 0
          maximum: 100
        upcomingEvents:
          type: array
          items:
            $ref: '#/components/schemas/AdminEventSummary'
        activeDuesRounds:
          type: array
          items:
            $ref: '#/components/schemas/AdminDuesRoundSummary'
        recentReports:
          type: array
          items:
            $ref: '#/components/schemas/AdminPaymentRow'
    AdminEventSummary:
      type: object
      required: [id, title, startsAt, joinedCount, feeAmount, unpaidCount, reportedCount, confirmedCount]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        joinedCount:
          type: integer
        feeAmount:
          type: integer
          format: int64
        unpaidCount:
          type: integer
        reportedCount:
          type: integer
        confirmedCount:
          type: integer
    AdminDuesRoundSummary:
      type: object
      required: [id, title, amount, dueAt, targetCount, unpaidCount, reportedCount, confirmedCount, confirmedAmount]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        amount:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
        targetCount:
          type: integer
        unpaidCount:
          type: integer
        reportedCount:
          type: integer
        confirmedCount:
          type: integer
        confirmedAmount:
          type: integer
          format: int64
    AdminPaymentRow:
      type: object
      required: [paymentId, memberId, nickname, name, part, amount, status, dueAt, version]
      properties:
        paymentId:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        nickname:
          type: string
        name:
          type: string
        part:
          $ref: '#/components/schemas/MemberPart'
        amount:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PaymentStatus'
        dueAt:
          type: string
          format: date-time
        latestReport:
          $ref: '#/components/schemas/PaymentReport'
        version:
          type: integer
          format: int64
    AdminEventParticipant:
      type: object
      required: [participationId, memberId, nickname, name, part, joinedAt, amount, paymentStatus, version]
      properties:
        participationId:
          type: integer
          format: int64
        memberId:
          type: integer
          format: int64
        nickname:
          type: string
        name:
          type: string
        part:
          $ref: '#/components/schemas/MemberPart'
        joinedAt:
          type: string
          format: date-time
        paymentId:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        latestReport:
          $ref: '#/components/schemas/PaymentReport'
        version:
          type: integer
          format: int64
    AdminEventParticipantPage:
      type: object
      required: [event, items, page, size, totalElements, totalPages]
      properties:
        event:
          $ref: '#/components/schemas/AdminEventSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminEventParticipant'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    AdminDuesPaymentPage:
      type: object
      required: [duesRound, items, page, size, totalElements, totalPages]
      properties:
        duesRound:
          $ref: '#/components/schemas/AdminDuesRoundSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminPaymentRow'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    AdminPaymentReviewRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
        note:
          type: string
          maxLength: 500
    AdminPaymentReviewResponse:
      type: object
      required: [paymentId, status, version, reviewedAt]
      properties:
        paymentId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PaymentStatus'
        version:
          type: integer
          format: int64
        reviewedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [title, status, code, detail, timestamp]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
              reason:
                type: string
