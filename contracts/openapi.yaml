components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DuesRoundId:
      name: duesRoundId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: 요청 본문·경로·쿼리 값 오류 (`VALIDATION_FAILED`, `MALFORMED_JSON`, `INVALID_REQUEST`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validationFailed:
              summary: 필드 검증 실패
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: VALIDATION_FAILED
                detail: 요청 값을 확인해 주세요.
                instance: /api/v1/me/onboarding
                timestamp: '2026-09-03T09:30:00Z'
                fieldErrors:
                  - field: name
                    reason: 공백일 수 없습니다
    Unauthorized:
      description: 로그인 세션 없음·만료 또는 로컬 계정 정보 불일치 (`AUTHENTICATION_REQUIRED`, `INVALID_CREDENTIALS`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            authenticationRequired:
              value:
                type: about:blank
                title: Unauthorized
                status: 401
                code: AUTHENTICATION_REQUIRED
                detail: 로그인이 필요하거나 로그인 세션이 만료되었습니다.
                instance: /api/v1/me
                timestamp: '2026-09-03T09:30:00Z'
                fieldErrors: []
    Forbidden:
      description: 역할·소유권 부족 또는 CSRF 토큰 오류 (`FORBIDDEN`, `CSRF_TOKEN_INVALID`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 리소스가 없거나 현재 사용자에게 비공개 (`RESOURCE_NOT_FOUND`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 도메인 상태·낙관적 잠금 충돌 (`CONCURRENT_UPDATE` 또는 도메인별 `*_CONFLICT`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: 지원하지 않는 HTTP 메서드 (`METHOD_NOT_ALLOWED`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: 예상하지 못한 서버 오류 (`INTERNAL_SERVER_ERROR`). 내부 예외 상세는 노출하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CsrfResponse:
      type: object
      required: [headerName, parameterName, token]
      properties:
        headerName:
          type: string
        parameterName:
          type: string
        token:
          type: string
    LocalRegisterRequest:
      type: object
      required: [loginId, password, phoneNumber]
      properties:
        loginId:
          type: string
          pattern: '^[a-z0-9._-]{4,30}$'
          example: dclub.member
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: clubpass123!
        phoneNumber:
          type: string
          pattern: '^01[016789]-?[0-9]{3,4}-?[0-9]{4}$'
          example: 010-1234-5678
    LocalRegisterResponse:
      type: object
      required: [memberId, loginId]
      properties:
        memberId:
          type: integer
          format: int64
        loginId:
          type: string
    LocalLoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          example: dclub.member
        password:
          type: string
          format: password
          example: clubpass123!
    LocalLoginResponse:
      type: object
      required: [member, redirectPath]
      properties:
        member:
          $ref: '#/components/schemas/MeResponse'
