spring.application.name=club-event-fee-backend
spring.profiles.default=dev
server.port=8080
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:h2:mem:dclub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.h2.console.enabled=false

management.endpoints.web.exposure.include=health,info

# OpenAPI / Swagger UI (context path: /api/v1)
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

app.auth.dev-member-id=1
app.seed-demo-data=false
