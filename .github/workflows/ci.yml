name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  # dev 배포가 Docker 재기동 중인 상태에서 다음 push가 이를 중단하지 않게 한다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    # DEPLOY_ENABLED=true를 Repository variable로 등록한 뒤에만 실제 배포한다.
    if: >-
      github.ref == 'refs/heads/dev' &&
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$LIGHTSAIL_HOST"
          test -n "$LIGHTSAIL_SSH_PRIVATE_KEY"
          test -n "$LIGHTSAIL_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$LIGHTSAIL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Build and deploy on Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "ubuntu@${LIGHTSAIL_HOST}" \
            '
              set -e
              cd /home/ubuntu/umc-event-fee-webapp
              # 최초 한 번은 이 커밋의 deploy 스크립트 자체를 먼저 받는다.
              if [ ! -f deploy/deploy.sh ]; then
                git pull --ff-only origin dev
              fi
              bash deploy/deploy.sh
            '
