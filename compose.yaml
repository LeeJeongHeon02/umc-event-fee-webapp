services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dclub
      POSTGRES_USER: dclub
      POSTGRES_PASSWORD: dclub-local
    ports:
      - "5432:5432"
    volumes:
      - dclub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dclub -d dclub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dclub-postgres:
